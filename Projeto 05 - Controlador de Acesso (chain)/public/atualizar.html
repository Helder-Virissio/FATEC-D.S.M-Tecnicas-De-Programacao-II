<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Cadastro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div class="header-inner">
        <h1 class="brand">Sistema de Controle de Acesso</h1>
        <nav>
            <a href="/">Acesso</a>
            <a href="/consultar.html">Consultar</a>
            <a href="/cadastrar.html">Cadastrar</a>
            <a href="/atualizar.html" class="active">Atualizar</a>
            <a href="/excluir.html">Excluir</a>
        </nav>
    </div>
</header>

<main>
    <section class="card">
        <h1>Atualizar Cadastro</h1>
        <div class="form-group">
            <label for="idBusca">ID da pessoa</label>
            <input type="number" id="idBusca" min="1" placeholder="Digite o ID">
        </div>
        <button onclick="buscarPessoa()">Buscar Cadastro</button>
        <div id="mensagemBusca" class="message"></div>
    </section>

    <section class="card" id="cardFormulario" style="display:none;">
        <h2>Dados Cadastrais</h2>
        <form id="formAtualizacao">
            <div class="form-grid">
                <div class="form-group full">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento</label>
                    <input type="date" id="dataNascimento" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" required>
                        <option value="ALUNO">Aluno</option>
                        <option value="PROFESSOR">Professor</option>
                        <option value="FUNCIONARIO">Funcionário</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="senha">Senha de Acesso</label>
                    <input type="text" id="senha" inputmode="numeric" maxlength="5" pattern="\d{5}" required>
                </div>

                <div class="form-group">
                    <label for="ativo">Status</label>
                    <select id="ativo">
                        <option value="1">Ativo</option>
                        <option value="0">Inativo</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="success">Salvar Alterações</button>
        </form>
        <div id="mensagemAtualizacao" class="message"></div>
    </section>
</main>

<script>
    let idAtual = null;

    document.getElementById('senha').addEventListener('input', e => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
    });

    function mensagem(idElemento, tipo, texto) {
        const elemento = document.getElementById(idElemento);
        elemento.className = `message show ${tipo}`;
        elemento.innerHTML = texto;
    }

    async function buscarPessoa() {
        const id = document.getElementById('idBusca').value;
        document.getElementById('cardFormulario').style.display = 'none';

        if (!id) {
            return mensagem('mensagemBusca', 'warning', 'Informe um ID.');
        }

        const resposta = await fetch(`/api/pessoas?id=${id}`);
        const dados = await resposta.json();

        if (!resposta.ok) {
            return mensagem('mensagemBusca', 'danger', dados.error || 'Usuário não encontrado.');
        }

        idAtual = dados.id;
        document.getElementById('nome').value = dados.nome;
        document.getElementById('email').value = dados.email;
        document.getElementById('dataNascimento').value = dados.data_nascimento;
        document.getElementById('tipo').value = dados.tipo;
        document.getElementById('senha').value = dados.senha;
        document.getElementById('ativo').value = String(dados.ativo);
        document.getElementById('cardFormulario').style.display = 'block';

        mensagem('mensagemBusca', 'info', `Cadastro encontrado: <strong>${dados.nome}</strong>.`);
    }

    document.getElementById('formAtualizacao').addEventListener('submit', async e => {
        e.preventDefault();

        const payload = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            data_nascimento: document.getElementById('dataNascimento').value,
            tipo: document.getElementById('tipo').value,
            senha: document.getElementById('senha').value,
            ativo: document.getElementById('ativo').value
        };

        const resposta = await fetch(`/api/pessoas?id=${idAtual}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const dados = await resposta.json();

        if (resposta.ok) {
            mensagem('mensagemAtualizacao', 'success', 'Cadastro atualizado com sucesso.');
        } else {
            mensagem('mensagemAtualizacao', 'danger', `${dados.error || 'Erro ao atualizar.'}`);
        }
    });
</script>
</body>
</html>
